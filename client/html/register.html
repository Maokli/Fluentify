<!DOCTYPE html>

<html lang="en" class="light-style customizer-hide" dir="ltr" data-theme="theme-default" data-assets-path="../assets/"
  data-template="vertical-menu-template-free">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

  <title>Sign Up - Fluentify</title>

  <meta name="description" content="" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="../assets/img/fluentify/fluentify.ico" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
    rel="stylesheet" />

  <!-- Core CSS -->
  <link rel="stylesheet" href="../assets/vendor/css/style.css" />
  <link rel="stylesheet" href="../assets/vendor/css/global.css" />

  <!-- Page CSS -->
  <!-- Page -->
  <link rel="stylesheet" href="../assets/vendor/css/pages/page-auth.css" />
</head>

<body>
  <!-- Content -->

  <div class="container-xxl">
    <div class="authentication-wrapper authentication-basic container-p-y">
      <div class="authentication-inner">
        <!-- Register Card -->
        <div class="card">
          <div class="card-body">
            <!-- Logo -->
            <div class="app-brand justify-content-center">
              <img src="../assets/img/fluentify/fluentify.png" class="img-fluid" />
            </div>
            <!-- /Logo -->
            <h4 class="mb-2">Adventure starts here 🚀</h4>
            <p class="mb-4">Learn languages in an easy and fun Way </p>



            <form id="formAuthentication" class="mb-3" onsubmit="submitForm(event)" method="POST">
              <div class="mb-3">
                <label for="username" class="form-label">first Name</label>
                <input type="text" class="form-control" id="username" name="firstName"
                  placeholder="Enter your first Name" autofocus required />
              </div>
              <div class="mb-3">
                <label for="username" class="form-label">last Name</label>
                <input type="text" class="form-control" id="username" name="lastName" placeholder="Enter your last Name"
                  autofocus required />
              </div>
              <div>

              </div>

              <div class="mb-3">
                <label for="username" class="form-label">preferred languages</label>
                <select class="form-select" multiple aria-label="multiple select example" id="multiplechoice"
                  name="preferredLanguages" required>
                  <option selected>Open this select menu</option>
                  <option value="FR">French</option>
                  <option value="EN">English</option>
                  <option value="AR">Arabic</option>
                  <option value="ES">Spanish</option>
                  <option value="DE">German</option>
                  <option value="IT">Italian</option>
                  <option value="RS">Russian</option>
                  <option value="CHI">Chinese</option>
                  <option value="JP">Japanese</option>
                  <option value="KR ">Korean</option>
                  <option value="PH">Portuguese</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" class="form-control" id="email" name="email" placeholder="Enter your email" />
              </div>
              <div class="mb-3 form-password-toggle">
                <div class="d-flex justify-content-between">
                  <label class="form-label" for="password">Password</label>
                </div>
                <div class="input-group input-group-merge">
                  <input type="password" id="password" class="form-control" name="password" aria-describedby="password"
                    required />
                  <span class="input-group-text" onclick="PasswordShowHide();">
                    <i class="fas fa-eye" id="show_eye"></i>
                    <i class="fas fa-eye-slash d-none" id="hide_eye"></i>
                  </span>
                </div>
              </div>

              <div class="mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="terms-conditions" name="terms" />
                  <label class="form-check-label" for="terms-conditions">
                    I agree to
                    <a>privacy policy & terms</a>
                  </label>
                </div>
              </div>
              <div class="mb-3 text-danger" id="message">

              </div>
              <button class="btn btn-primary d-grid w-100">Sign up</button>
            </form>

            <p class="text-center">
              <span>Already have an account?</span>
              <a href="login.html">
                <span>Sign in instead</span>
              </a>
            </p>
          </div>
        </div>
        <!-- Register Card -->
      </div>
    </div>
  </div>
  <script src="../assets/js/HideFunctionality.js"></script>
  <script src="../scripts/register.js"></script>
  <!-- / Content -->
</body>

</html>
